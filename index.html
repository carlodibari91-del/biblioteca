<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mia Biblioteca</title>
<meta name="description" content="I libri di casa, dove sono e cosa hai letto ogni anno.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#ededed;--primary:#b3003c;--on-primary:#ffffff;--dark:#76052b;--on-dark:#ffffff;
  --accent:#b3003c;--ring:#ffffff;--ring-track:#9a0034;--title:#76052b;--text:#000000;--muted:#666666;
  --line:#e0e0e0;--track:#d6d6d6;--bar:#76052b;
  --serif:Fraunces,Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--title)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.1;margin:0;color:var(--title)}
h2{font-size:1.05rem;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{min-height:48px;border-radius:14px;border:0;background:var(--primary);color:var(--on-primary);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--title);border:2px solid var(--primary)}
.btn.quiet{background:var(--surface);color:var(--text)}
.btn.plain{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);color:var(--text);text-decoration:none;flex:none}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
textarea.input{min-height:84px;padding:12px 14px;resize:vertical}
select.input{appearance:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.inline{display:flex;gap:8px}
.inline .input{flex:1}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--primary)}

.searchbox{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface);color:var(--muted)}
.searchbox input{flex:1;border:0;background:transparent;outline:none;color:var(--text);min-height:46px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:.85rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{min-height:40px;font-size:.88rem}
.placebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--dark);color:var(--on-dark);font-size:.9rem;font-weight:600}
.placebar button{background:transparent;color:inherit;border:0;min-width:44px;min-height:36px;cursor:pointer;font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--title);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-decoration:none;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font-size:.8rem;color:var(--muted)}
.pill{flex:none;font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--surface);color:var(--text)}
.pill.in-lettura{background:var(--primary);color:var(--on-primary)}
.pill.prestato{background:var(--dark);color:var(--on-dark)}
.pill.da-leggere{background:transparent;color:var(--muted);border:1px solid var(--line)}

.cover{position:relative;flex:none;width:50px;height:74px;border-radius:4px;background:var(--dark);color:var(--on-dark);overflow:hidden;font-family:var(--serif);font-size:9px;font-weight:600;line-height:1.15;padding:6px;display:flex;align-items:flex-end;word-break:break-word}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.lg{width:100px;height:148px;font-size:13px;padding:10px;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.cover.sm{width:34px;height:50px;font-size:0;padding:0;border-radius:3px}

.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:36px 12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:2px solid var(--primary);font-size:.9rem}
.banner a{font-weight:700;white-space:nowrap}

.hero{margin:calc(-22px - env(safe-area-inset-top,0px)) -18px 0;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;background:var(--dark);color:var(--on-dark);display:flex;flex-direction:column;gap:18px}
.hero .iconbtn{background:rgba(255,255,255,.16);color:var(--on-dark)}
.hero h1{color:var(--on-dark);font-size:1.7rem}
.hero .a{color:var(--on-dark);opacity:.85;white-space:normal}
.hero-body{display:flex;gap:18px;align-items:flex-end}
.hero-top{display:flex;justify-content:space-between}
dl.info{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
dl.info dt{font-size:.78rem;color:var(--muted)}
dl.info dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.reading{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.reading .dates{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.reading .dates input{min-height:42px;font-size:.88rem}
.stars{display:flex;gap:0}
.stars button{width:36px;height:36px;border:0;background:none;color:var(--primary);font-size:22px;padding:0;cursor:pointer;line-height:1}
.stars.ro{font-size:.85rem;color:var(--primary);letter-spacing:1px}
.genres{display:flex;flex-wrap:wrap;gap:8px}
.genres label{position:relative}
.genres input{position:absolute;opacity:0;width:1px;height:1px}
.genres span{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);font-size:.85rem;cursor:pointer}
.genres input:checked+span{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.genres input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}

.scanner{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scanner .frame{position:absolute;inset:28% 10%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanner .laser{position:absolute;left:14%;right:14%;top:50%;height:2px;background:var(--primary);box-shadow:0 0 10px var(--primary)}

.shelf{border:5px solid var(--dark);border-radius:8px;background:var(--surface)}
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 0;font-weight:700}
.shelf-h span{font-size:.8rem;font-weight:500;color:var(--muted)}
.level{display:flex;align-items:flex-end;gap:10px;width:100%;min-height:68px;padding:6px 10px 0;border:0;border-bottom:5px solid var(--dark);background:none;cursor:pointer;text-align:left}
.level:last-child{border-bottom:0}
.level .lv{flex:none;width:64px;font-size:.78rem;font-weight:600;color:var(--muted);padding-bottom:6px}
.level .n{flex:none;font-size:.85rem;font-weight:700;padding-bottom:6px}
.spines{flex:1;display:flex;align-items:flex-end;gap:2px;height:50px;overflow:hidden}
.spines i{display:block;flex:none;width:9px;border-radius:1px 1px 0 0}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:.78rem;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.1}
.kpi .d{font-size:.75rem;color:var(--muted)}
.goal{background:var(--dark);color:var(--on-dark);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:118px}
.months div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem}
.months i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--bar)}
.months span{color:var(--muted)}
.hrow{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:.85rem}
.hbar{height:12px;border-radius:6px;background:var(--track)}
.hbar i{display:block;height:100%;border-radius:6px;background:var(--bar)}
.stackbar{display:flex;height:18px;border-radius:9px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:5px;display:inline-block}

.palette{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;width:100%}
.palette[aria-pressed="true"]{border:2px solid var(--primary)}
.dots{display:flex;padding-left:6px}
.dots i{width:22px;height:22px;border-radius:11px;border:2px solid var(--bg);margin-left:-6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-start;z-index:10}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:44px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a[aria-current="page"]{color:var(--title);font-weight:700}
nav.tabs a.fab{width:58px;height:58px;min-width:0;margin-top:-24px;border-radius:29px;background:var(--primary);color:var(--on-primary);justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigazione principale">
  <a href="#/libreria" data-tab="libreria"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Biblioteca</a>
  <a href="#/scaffali" data-tab="scaffali"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18"/></svg>Scaffali</a>
  <a href="#/aggiungi" data-tab="aggiungi" class="fab" aria-label="Aggiungi libro"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M14 8v8M17 8v8"/></svg></a>
  <a href="#/letture" data-tab="letture"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Letture</a>
  <a href="#/dati" data-tab="dati"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Dati</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importfile" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
